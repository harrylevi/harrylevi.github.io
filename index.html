<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome | Sandeep Seelam</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
        }

        /* Opening screen */
        .intro {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at center, #182848 0%, #050505 65%);
            animation: introExit 1.5s ease 4.5s forwards;
        }

        .intro-content {
            text-align: center;
            color: white;
            animation: zoomIn 2s cubic-bezier(.16,1,.3,1);
        }

        .small-text {
            font-size: 14px;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 1.2s ease 0.5s forwards;
        }

        .welcome {
            margin-top: 20px;
            font-size: clamp(55px, 10vw, 130px);
            font-weight: 800;
            letter-spacing: -4px;
            background: linear-gradient(
                90deg,
                #ffffff,
                #8ec5ff,
                #ffffff
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation:
                fadeUp 1.4s ease 0.9s forwards,
                shine 3s linear infinite;
            opacity: 0;
        }

        .name {
            margin-top: 15px;
            font-size: clamp(20px, 3vw, 32px);
            letter-spacing: 12px;
            text-transform: uppercase;
            color: #8ec5ff;
            opacity: 0;
            animation: fadeUp 1.4s ease 1.5s forwards;
        }

        .line {
            width: 0;
            height: 2px;
            margin: 30px auto;
            background: white;
            box-shadow: 0 0 20px #8ec5ff;
            animation: lineGrow 1.5s ease 2.1s forwards;
        }

        .loading {
            font-size: 12px;
            letter-spacing: 5px;
            color: rgba(255,255,255,0.6);
            opacity: 0;
            animation: fadeUp 1s ease 2.5s forwards;
        }

        /* Background particles */
        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: float 6s infinite ease-in-out;
        }

        .particle:nth-child(1) { left: 10%; top: 80%; animation-delay: .2s; }
        .particle:nth-child(2) { left: 20%; top: 30%; animation-delay: 1s; }
        .particle:nth-child(3) { left: 35%; top: 70%; animation-delay: 2s; }
        .particle:nth-child(4) { left: 50%; top: 20%; animation-delay: .5s; }
        .particle:nth-child(5) { left: 65%; top: 75%; animation-delay: 1.5s; }
        .particle:nth-child(6) { left: 80%; top: 35%; animation-delay: 2.5s; }
        .particle:nth-child(7) { left: 90%; top: 80%; animation-delay: 1.2s; }
        .particle:nth-child(8) { left: 45%; top: 90%; animation-delay: 3s; }
        .particle:nth-child(9) { left: 75%; top: 15%; animation-delay: .8s; }
        .particle:nth-child(10) { left: 5%; top: 20%; animation-delay: 2.2s; }

        /* Main website */
        .main {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background:
                linear-gradient(135deg, #0f172a, #020617);
            color: white;
        }

        .main-content h1 {
            font-size: clamp(45px, 8vw, 90px);
        }

        .main-content p {
            margin-top: 15px;
            font-size: 20px;
            color: #94a3b8;
        }

        /* Animations */

        @keyframes zoomIn {
            from {
                transform: scale(0.7);
                filter: blur(15px);
            }
            to {
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes lineGrow {
            to {
                width: 180px;
            }
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        @keyframes float {
            0% {
                opacity: 0;
                transform: translateY(0) scale(1);
            }

            30% {
                opacity: 0.8;
            }

            100% {
                opacity: 0;
                transform: translateY(-150px) scale(1.8);
            }
        }

        @keyframes introExit {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>

<body>

    <!-- Animated opening -->
    <section class="intro">

        <div class="particles">
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
        </div>

        <div class="intro-content">

            <div class="small-text">
                Welcome to
            </div>

            <div class="welcome">
                WELCOME
            </div>

            <div class="name">
                HARRYLIVE
            </div>

            <div class="line"></div>

            <div class="loading">
                ENTERING EXPERIENCE
            </div>

        </div>

    </section>


    <!-- Main website -->
    <main class="main">

        <div class="main-content">

            <h1>HarryLive</h1>

            <p>
                Something amazing is being built here.
            </p>

        </div>

    </main>

</body>
</html>
